<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>名片 · 电子招牌</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--open:#0F6E56;--open2:#12805F;--closed:#4B4B45;--cream:#FBF9F1;--dim:#C9C6BA}
  html,body{height:100%;overflow-x:hidden;max-width:100vw}
  body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--open);color:var(--cream);
       display:flex;flex-direction:column;transition:background .35s}
  body.closed{background:var(--closed)}
  .top{padding:22px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .state{font-size:13px;letter-spacing:3px;opacity:.9;display:flex;align-items:center;gap:8px;flex:none}
  .pulse{width:9px;height:9px;border-radius:50%;background:#7BE0B8;box-shadow:0 0 0 0 rgba(123,224,184,.7);
         animation:p 2s infinite}
  @keyframes p{70%{box-shadow:0 0 0 12px rgba(123,224,184,0)}100%{box-shadow:0 0 0 0 rgba(123,224,184,0)}}
  .clock{font-size:13px;opacity:.75;font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
  h1{font-size:min(13vw,52px);line-height:1.15;padding:14px 22px 0;letter-spacing:2px;font-weight:700;
     overflow-wrap:anywhere}
  .addr{font-size:13px;opacity:.8;padding:8px 22px 0;letter-spacing:1px;overflow-wrap:anywhere}
  .body{flex:1;padding:20px 22px 0;overflow:auto;min-height:0}
  .label{font-size:12px;letter-spacing:4px;opacity:.72;margin-bottom:10px}
  .item{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
        padding:10px 0;border-bottom:1px solid rgba(251,249,241,.16);font-size:min(5.2vw,21px)}
  .item:last-child{border-bottom:0}
  .item .n{font-weight:500;min-width:0;overflow-wrap:anywhere}
  .item .t{font-size:12px;opacity:.75;flex:none}
  .empty{font-size:15px;opacity:.7;padding:16px 0}
  .foot{padding:14px 22px calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
  .qr{width:86px;height:86px;background:#fff;border-radius:8px;flex:none;display:flex;align-items:center;
      justify-content:center;overflow:hidden}
  .qr canvas,.qr img{display:block}
  .footinfo{flex:1;min-width:0}  .footinfo .phone{font-size:min(5.6vw,22px);letter-spacing:1px;font-variant-numeric:tabular-nums}
  .footinfo .tip{font-size:11px;opacity:.7;margin-top:5px;line-height:1.5;word-break:break-all}
  .closed .pulse{background:#B4B2A9;animation:none}
  .closed .qr{opacity:.5}
</style>
</head>
<body>
<div class="top">
  <div class="state"><i class="pulse"></i><span id="state">营业中</span></div>
  <div class="clock" id="clock"></div>
</div>
<h1 id="name">名片</h1>
<div class="addr" id="addr"></div>
<div class="body">
  <div class="label">今 日 有 货</div>
  <div id="items"><p class="empty">正在读取…</p></div>
</div>
<div class="foot">
  <div class="qr" id="qr"></div>
  <div class="footinfo">
    <div class="phone" id="phone"></div>
    <div class="tip" id="tip"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id') || '';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let first = true;

function clock(){
  const d=new Date();
  document.getElementById('clock').textContent =
    d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit',weekday:'short'})+' '+
    d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}

function drawQR(url){
  const box = document.getElementById('qr');
  box.innerHTML='';
  if (typeof QRCode !== 'undefined'){
    try{ new QRCode(box, {text:url, width:82, height:82, correctLevel:QRCode.CorrectLevel.M}); return; }catch(e){}
  }
  box.innerHTML = '<span style="color:#0F6E56;font-size:10px;padding:6px;text-align:center;line-height:1.35">离线<br>看下方<br>网址</span>';
}

async function load(){
  if (!id){ document.getElementById('name').textContent='缺少店铺 id'; return; }
  try{
    const r = await fetch('/api/shop/'+encodeURIComponent(id));
    if (!r.ok) throw 0;
    const s = await r.json();
    document.body.classList.toggle('closed', !s.open);
    document.getElementById('state').textContent = s.open ? '营业中' : '已打烊';
    document.getElementById('name').textContent = s.name;
    document.getElementById('addr').textContent = [s.address, s.hours].filter(Boolean).join(' · ');
    document.getElementById('phone').textContent = s.phone || '';
    document.getElementById('items').innerHTML = (s.items&&s.items.length)
      ? s.items.map(i=>`<div class="item"><span class="n">${esc(i.name)}${i.unit?' <span style="font-size:12px;opacity:.7">/'+esc(i.unit)+'</span>':''}</span>
          <span class="t">${esc(i.note||'')}${i.note?' · ':''}${esc(i.tag)}</span></div>`).join('')
      : '<p class="empty">今天还没上货</p>';

    const base = location.origin;
    const url = base + '/index.html';
    if (first){ drawQR(url); first=false; }
    document.getElementById('tip').textContent = url.replace('http://','') + ' · 同 WiFi 可看';
    document.title = s.name + (s.open?' · 营业中':' · 已打烊');
  }catch(e){
    document.getElementById('items').innerHTML='<p class="empty">连不上本机服务</p>';
  }
}

// 电子名片常亮：有 Wake Lock 就用，没有就靠系统设置
let wl=null;
async function keepAwake(){
  try{ if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') keepAwake(); });

clock(); setInterval(clock,1000); load(); setInterval(load,15000); keepAwake();
</script>
</body>
</html>
