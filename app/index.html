<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>门牌 · 本地</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--paper:#F7F6F2;--card:#FFF;--ink:#1F2937;--sub:#6B7280;--line:#E5E3DC;
        --teal:#0F6E56;--teal-l:#E1F5EE;--amber:#B45309;--amber-l:#FAEEDA;--red:#A32D2D}
  body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);
       color:var(--ink);padding-bottom:70px;overflow-x:hidden}
  header{position:sticky;top:0;z-index:50;background:var(--paper);padding:12px 16px 10px;
         border-bottom:1px solid var(--line)}
  header h1{font-size:18px;letter-spacing:2px;display:flex;align-items:baseline;gap:8px}
  header h1 small{font-size:11px;color:var(--sub);font-weight:400;letter-spacing:0}
  .wrap{padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .card h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .badge{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--teal-l);
         color:var(--teal);font-weight:500;flex:none}
  .badge.l0{background:#F1EFE8;color:#6B6A63}
  .badge.l1{background:#E6F1FB;color:#0C447C}
  .meta{font-size:12px;color:var(--sub);line-height:1.7}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{font-size:12px;background:#F2F1EC;border-radius:6px;padding:4px 8px;color:#3F3D37}
  .chip i{font-style:normal;color:var(--amber);margin-left:4px;font-size:11px}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;
        font-size:15px;font-family:inherit;background:#FCFCFA;color:var(--ink)}
  textarea{min-height:88px;resize:vertical;font-size:12px;font-family:ui-monospace,monospace}
  .btn{width:100%;border:0;border-radius:10px;padding:14px;font-size:15px;font-weight:600;
       background:var(--teal);color:#fff;margin-top:10px;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}
  .btn.warn{background:var(--amber)}
  .btn:disabled{opacity:.45}
  .row{display:flex;gap:8px;margin-top:10px}
  .row>*{flex:1}
  .hint{font-size:11px;color:var(--sub);line-height:1.7;margin-top:8px}
  #map{width:100%;height:190px;background:#E8E6DF;border-radius:10px;margin-top:8px;display:block}
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
      display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:60}
  nav button{flex:1;background:none;border:0;font-size:12px;color:var(--sub);font-family:inherit;cursor:pointer}
  nav button.on{color:var(--teal);font-weight:600}
  nav button span{display:block;font-size:19px;line-height:1.25}
  .tab{display:none}.tab.on{display:block}
  .mask{position:fixed;inset:0;background:rgba(31,41,55,.42);display:none;z-index:90}
  .mask.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;
         z-index:91;padding:18px 16px 26px;max-height:78vh;overflow:auto;transform:translateY(100%);
         transition:.22s}
  .sheet.show{transform:translateY(0)}
  .sheet .close{position:absolute;right:14px;top:12px;border:0;background:none;font-size:20px;color:var(--sub)}
  .timer{background:var(--teal-l);border-radius:10px;padding:12px;margin-bottom:10px;font-size:13px}
  .timer b{font-size:20px;color:var(--teal);font-variant-numeric:tabular-nums}
  .empty{color:var(--sub);font-size:13px;padding:6px 0}
  .code{background:#F4F3EE;border:1px dashed var(--line);border-radius:8px;padding:10px;
        font-size:11px;font-family:ui-monospace,monospace;word-break:break-all;max-height:120px;overflow:auto}
  .tag-pending{background:var(--amber-l);color:#633806;font-size:11px;padding:2px 8px;border-radius:99px}
</style>
</head>
<body>
<header>
  <h1>门牌 <small id="devid">初始化中…</small></h1>
</header>

<div class="wrap">
  <!-- ============ 逛街 ============ -->
  <div class="tab on" id="tab-street">
    <div class="card" style="padding:12px 14px">
      <div class="meta" id="summary">还没有店</div>
    </div>
    <div id="list"></div>
  </div>

  <!-- ============ 标注 ============ -->
  <div class="tab" id="tab-mark">
    <div class="card">
      <h3>这条街上有什么 <span class="badge l0" id="timing">未计时</span></h3>
      <div class="meta">只写「有什么」，不写价钱 —— 多少钱是老板和客人之间的事。</div>

      <label>店名</label>
      <input id="f-name" placeholder="好又多超市">
      <label>地址</label>
      <input id="f-addr" placeholder="解放路 12 号">
      <div class="row">
        <div><label>电话</label><input id="f-phone" placeholder="138…"></div>
        <div><label>营业时间</label><input id="f-hours" placeholder="07:00-22:00"></div>
      </div>

      <label>点一下地图定位（或按下面按钮取当前位置）</label>
      <canvas id="map" width="600" height="380"></canvas>
      <div class="row">
        <button class="btn ghost" id="btn-here">用当前位置</button>
        <button class="btn ghost" id="btn-clear">清除选点</button>
      </div>

      <label>今日有什么（一行一样，格式：名称/单位/备注）</label>
      <textarea id="f-items" placeholder="本地鸡蛋/斤/今早到货
大米/袋/25kg
散装酱油/斤/"></textarea>

      <button class="btn" id="btn-save">挂上门牌</button>
      <button class="btn ghost" id="btn-start">重新开始计时</button>
      <p class="hint">计时用于回答一个关键问题：<b>标一家店要多久</b>。
        如果二十家要两小时，这个产品从第一天就没人维护。</p>
    </div>
  </div>

  <!-- ============ 我的 ============ -->
  <div class="tab" id="tab-mine">
    <div class="card">
      <h3>这台设备</h3>
      <div class="meta">指纹 <b id="devid2">—</b>　（私钥只在这台机器上，永不出门）</div>
      <div class="row">
        <button class="btn ghost" id="btn-export">导出全部数据</button>
        <button class="btn ghost" id="btn-import">导入别人数据</button>
      </div>
      <p class="hint">两台手机之间：A 点导出 → 把文字发给 B → B 点导入。
        事件会自动补齐，不需要任何服务器。</p>
    </div>

    <div class="card">
      <h3>认领我的店</h3>
      <div class="meta" id="claim-hint">还没选店</div>
      <div id="claim-list"></div>
    </div>

    <div class="card">
      <h3>给人作保</h3>
      <div class="meta">收到别人的认领请求码，贴在这里，我来作保（需 2 位邻居）。</div>
      <textarea id="in-claimreq" placeholder="粘贴认领请求码"></textarea>
      <button class="btn" id="btn-sponsor">我来作保</button>
      <div id="sponsor-out"></div>
    </div>

    <div class="card">
      <h3>接收担保</h3>
      <div class="meta">别人给我作保后，把担保码贴在这里。</div>
      <textarea id="in-sponsor" placeholder="粘贴担保码"></textarea>
      <button class="btn" id="btn-accept-sponsor">提交担保</button>
    </div>

    <div class="card">
      <h3>计时报告</h3>
      <div id="report" class="meta">还没有记录</div>
    </div>
  </div>
</div>

<nav>
  <button class="on" data-tab="street"><span>◉</span>逛街</button>
  <button data-tab="mark"><span>✎</span>标注</button>
  <button data-tab="mine"><span>◎</span>我的</button>
</nav>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"><button class="close" id="sheet-close">✕</button><div id="sheet-body"></div></div>

<script src="core.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const ROOT_KEY = "dp_root";       // 发起人（根信任）
const ID_KEY = "dp_identity";
const EV_KEY = "dp_events";
const T_KEY = "dp_timing";

let identity = null, store = null, rootId = null;
let picked = null;                // 地图上选的点 {lat, lon}
let timerStart = null;
let geo = { lat: 29.840, lon: 112.900 };

// ---------------- 初始化 ----------------
function loadIdentity() {
  const raw = localStorage.getItem(ID_KEY);
  if (raw) return DP.Identity.fromJSON(JSON.parse(raw));
  const id = DP.Identity.generate();
  localStorage.setItem(ID_KEY, JSON.stringify(id.toJSON()));
  return id;
}

function boot() {
  $("summary").textContent = "正在准备密钥（首次约 1-2 秒）…";
  setTimeout(() => {
    identity = loadIdentity();
    rootId = localStorage.getItem(ROOT_KEY) || null;
    store = new DP.Store(identity, rootId, EV_KEY);
    $("devid").textContent = identity.deviceId;
    $("devid2").textContent = identity.deviceId;
    render();
    initMap();
    const h = (location.hash || "").replace("#", "");
    if (["street", "mark", "mine"].includes(h)) switchTab(h);
  }, 30);
}

// ---------------- 渲染 ----------------
function state() { return store.state(new Date()); }

function render() {
  const st = state();
  const shops = Object.values(st).sort((a, b) => (a.open === b.open ? 0 : (a.open ? -1 : 1)));
  const openCount = shops.filter(s => s.open).length;
  $("summary").innerHTML = shops.length
    ? `开门做生意 <b style="color:var(--teal)">${openCount}</b> 家 · 共 ${shops.length} 家 · 设备 <b>${identity.deviceId}</b>`
    : "这条街还没有店挂上门牌，去「标注」加一个。";

  $("list").innerHTML = shops.length ? shops.map(s => {
    const items = (s.items || []).slice(0, 4).map(i =>
      `<span class="chip">${esc(i.name)}${i.unit ? " / " + esc(i.unit) : ""}<i>${esc(i.tag || "可议")}</i></span>`).join("");
    const tv = s.trust === "L2" ? '<span class="badge">店主认领</span>'
      : s.trust === "L1" ? '<span class="badge l1">多人确认</span>'
      : '<span class="badge l0">路人标注</span>';
    const pend = (s.claim_pending && s.claim_pending.length)
      ? '<span class="tag-pending">待担保</span>' : "";
    return `<div class="card" data-id="${esc(s.id)}">
      <h3>${esc(s.name || s.id)} ${tv} ${pend}</h3>
      <div class="meta">${esc(s.address || "—")}${s.hours ? " · " + esc(s.hours) : ""}
        ${s.open ? " · 营业中" : " · 已打烊"}</div>
      <div class="chips">${items || '<span class="chip">今日未上货</span>'}</div>
    </div>`;
  }).join("") : "";

  document.querySelectorAll("#list .card").forEach(el => {
    el.onclick = () => showShop(st[el.dataset.id]);
  });

  renderClaimList(st);
  renderReport();
}

function showShop(s) {
  if (!s) return;
  const rows = (s.items || []).map(i =>
    `<div class="meta" style="display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:8px 0">
      <span>${esc(i.name)}${i.unit ? " / " + esc(i.unit) : ""}</span>
      <span>${esc(i.note || "")} · ${esc(i.tag || "可议")}</span></div>`).join("");
  $("sheet-body").innerHTML = `
    <h3 style="font-size:18px">${esc(s.name)}</h3>
    <div class="meta" style="margin-bottom:10px">${esc(s.address || "—")}${s.hours ? " · " + esc(s.hours) : ""}</div>
    ${rows || '<p class="empty">今日未上货</p>'}
    ${s.note ? `<p class="meta" style="margin-top:10px">${esc(s.note)}</p>` : ""}
    <p class="meta" style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
      可信度：${esc(s.trust)} — ${esc(s.trust_reason)}<br>
      事件数：${s.events}${s.conflicts && Object.keys(s.conflicts).length ? " · 存在分歧：" + Object.keys(s.conflicts).join("、") : ""}
    </p>
    ${s.phone ? `<a class="btn" href="tel:${esc(s.phone)}" style="display:block;text-align:center;text-decoration:none;background:var(--teal-l);color:var(--teal)">打电话 ${esc(s.phone)}</a>` : ""}`;
  $("mask").classList.add("show"); $("sheet").classList.add("show");
}

function renderClaimList(st) {
  const mine = Object.values(st).filter(s => !s.owner || s.owner === identity.deviceId);
  $("claim-list").innerHTML = mine.length ? mine.map(s => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
      <span>${esc(s.name || s.id)}${s.owner === identity.deviceId ? ' <span class="badge">已认领</span>' : ""}</span>
      <button class="btn ghost" style="width:auto;padding:6px 12px;margin:0;font-size:13px"
        data-claim="${esc(s.id)}">${s.owner === identity.deviceId ? "生成请求码" : "认领"}</button>
    </div>`).join("") : '<p class="empty">这里会列出你能认领的店</p>';

  document.querySelectorAll("[data-claim]").forEach(b => {
    b.onclick = () => claimShop(b.dataset.claim);
  });
}

function renderReport() {
  const t = JSON.parse(localStorage.getItem(T_KEY) || "[]");
  if (!t.length) { $("report").textContent = "还没有记录"; return; }
  const total = t.reduce((a, x) => a + x.sec, 0);
  const avg = Math.round(total / t.length);
  $("report").innerHTML = `已标注 <b>${t.length}</b> 家 · 总耗时 <b>${fmt(total)}</b> · 平均 <b>${fmt(avg)}</b>/家<br>
    <span style="font-size:11px">按此速度，20 家需要约 <b>${fmt(avg * 20)}</b></span>`;
}

function fmt(sec) {
  if (sec < 60) return sec + " 秒";
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + " 分" + (s ? " " + s + " 秒" : "");
}

// ---------------- 地图（离线段） ----------------
let cv, ctx;
function initMap() {
  cv = $("map"); ctx = cv.getContext("2d");
  drawMap();
  cv.addEventListener("click", e => {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    picked = { lat: geo.lat + (0.5 - y) * 0.012, lon: geo.lon + (x - 0.5) * 0.012 };
    drawMap();
  });
}

function pos2xy(lat, lon) {
  return [((lon - geo.lon) / 0.012 + 0.5) * cv.width,
          (0.5 - (lat - geo.lat) / 0.012) * cv.height];
}

function drawMap() {
  if (!ctx) return;
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#E8E6DF"; ctx.fillRect(0, 0, W, H);
  // 网格（每格约 100 米）
  ctx.strokeStyle = "#D5D2C8"; ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    ctx.beginPath(); ctx.moveTo(W * i / 6, 0); ctx.lineTo(W * i / 6, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, H * i / 6); ctx.lineTo(W, H * i / 6); ctx.stroke();
  }
  // 距离环
  ctx.strokeStyle = "#C9C5B8"; ctx.setLineDash([6, 6]);
  [80, 160].forEach(r => { ctx.beginPath(); ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2); ctx.stroke(); });
  ctx.setLineDash([]);
  // 我
  ctx.fillStyle = "#185FA5";
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#0C447C"; ctx.font = "22px system-ui";
  ctx.fillText("我", W / 2 + 10, H / 2 + 7);
  // 已有店铺
  const st = state();
  Object.values(st).forEach(s => {
    if (!s.lat || !s.lon) return;
    const [x, y] = pos2xy(s.lat, s.lon);
    ctx.fillStyle = s.open ? "#0F6E56" : "#B4B2A9";
    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3F3D37"; ctx.font = "20px system-ui";
    ctx.fillText(s.name.slice(0, 5), x + 11, y + 6);
  });
  // 选点
  if (picked) {
    const [x, y] = pos2xy(picked.lat, picked.lon);
    ctx.fillStyle = "#B45309";
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  }
}

// ---------------- 标注 ----------------
function parseItems(text) {
  return text.split("\n").map(l => l.trim()).filter(Boolean).slice(0, 40).map(line => {
    const p = line.split("/").map(s => s.trim());
    return { name: p[0] || "", unit: p[1] || "", note: p[2] || "", tag: "可议" };
  }).filter(x => x.name);
}

$("btn-save").onclick = () => {
  const name = $("f-name").value.trim();
  if (!name) { alert("店名不能空"); return; }
  const id = "shop-" + Date.now().toString(36);
  const loc = picked || { lat: geo.lat, lon: geo.lon };
  store.add("anchor", id, {
    fields: {
      name, address: $("f-addr").value.trim(),
      phone: $("f-phone").value.trim(), hours: $("f-hours").value.trim(),
      lat: Number(loc.lat.toFixed(6)), lon: Number(loc.lon.toFixed(6)),
      items: parseItems($("f-items").value), open: true
    }
  });

  // 计时
  if (timerStart) {
    const sec = Math.round((Date.now() - timerStart) / 1000);
    const t = JSON.parse(localStorage.getItem(T_KEY) || "[]");
    t.push({ sec, at: new Date().toISOString() });
    localStorage.setItem(T_KEY, JSON.stringify(t));
    $("timing").textContent = "上一家 " + fmt(sec);
  } else {
    timerStart = Date.now();
    $("timing").textContent = "计时中…";
  }

  $("f-name").value = ""; $("f-addr").value = ""; $("f-items").value = "";
  picked = null;
  render(); drawMap();
  switchTab("street");
};

$("btn-start").onclick = () => {
  timerStart = Date.now();
  $("timing").textContent = "计时中…";
};

$("btn-here").onclick = () => {
  if (!navigator.geolocation) { alert("这台设备不支持定位，直接在地图上点选"); return; }
  navigator.geolocation.getCurrentPosition(p => {
    geo = { lat: p.coords.latitude, lon: p.coords.longitude };
    picked = { ...geo };
    drawMap();
  }, () => alert("取不到定位（或未授权），直接在地图上点选即可"));
};

$("btn-clear").onclick = () => { picked = null; drawMap(); };

// ---------------- 认领 / 担保 ----------------
function b64(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function unb64(s) { return JSON.parse(decodeURIComponent(escape(atob(s.trim())))); }

function claimShop(shopId) {
  const st = state()[shopId];
  const isOwner = st && st.owner === identity.deviceId;
  const pending = st && st.claim_pending && st.claim_pending.includes(identity.deviceId);

  if (isOwner || pending) {
    const code = b64({ t: "claimreq", shop: shopId, claimer: identity.deviceId, pub: identity.pubkeyStr });
    $("sheet-body").innerHTML = `
      <h3 style="font-size:17px">认领请求码</h3>
      <p class="meta">把这段发给两位已认领的邻居，他们各自给你回一个担保码。</p>
      <div class="code">${esc(code)}</div>
      <p class="meta" style="margin-top:10px">${isOwner ? "你已经是店主。" : "目前状态：待担保（需要 2 位）。"}</p>`;
  } else {
    store.add("claim", shopId, { sponsors: [] });
    $("sheet-body").innerHTML = `
      <h3 style="font-size:17px">已提交认领</h3>
      <p class="meta">现在需要 2 位已认领的店主作保，才能升级为「店主认领」。</p>`;
    render();
  }
  $("mask").classList.add("show"); $("sheet").classList.add("show");
}

$("btn-sponsor").onclick = () => {
  let req;
  try { req = unb64($("in-claimreq").value); } catch (e) { alert("请求码格式不对"); return; }
  if (req.t !== "claimreq") { alert("这不是认领请求码"); return; }
  const sp = DP.sponsorSign(identity, req.shop, req.claimer);
  const code = b64({ t: "sponsor", shop: req.shop, claimer: req.claimer, sponsor: sp });
  $("sponsor-out").innerHTML = `<div class="code" style="margin-top:10px">${esc(code)}</div>
    <p class="hint">把这段回给对方。</p>`;
};

$("btn-accept-sponsor").onclick = () => {
  let pack;
  try { pack = unb64($("in-sponsor").value); } catch (e) { alert("担保码格式不对"); return; }
  if (pack.t !== "sponsor" || pack.claimer !== identity.deviceId) { alert("这个担保码不是给你的"); return; }
  const st = state()[pack.shop];
  const old = (st && store.events) ? [] : [];
  // 取出自己的最近一条认领，追加担保人
  const mine = [...store.events.values()]
    .filter(e => e.type === "claim" && e.target === pack.shop && e.author === identity.deviceId)
    .sort((a, b) => (a.ts < b.ts ? 1 : -1))[0];
  const sponsors = mine ? (mine.payload.sponsors || []).slice() : [];
  if (sponsors.some(s => s.by === pack.sponsor.by)) { alert("这位已经作保过了"); return; }
  sponsors.push(pack.sponsor);
  store.add("claim", pack.shop, { sponsors });
  render();
  alert("担保已接收，当前 " + sponsors.length + " 位作保" + (sponsors.length >= 2 ? "，已生效" : "，还差 " + (2 - sponsors.length) + " 位"));
};

// ---------------- 导入导出 ----------------
$("btn-export").onclick = () => {
  const data = { t: "events", events: [...store.events.values()] };
  const code = b64(data);
  $("sheet-body").innerHTML = `<h3 style="font-size:17px">全部数据</h3>
    <p class="meta">把这段发给另一台手机，让对方点「导入别人数据」。</p>
    <div class="code" style="max-height:220px">${esc(code)}</div>`;
  $("mask").classList.add("show"); $("sheet").classList.add("show");
};

$("btn-import").onclick = () => {
  $("sheet-body").innerHTML = `<h3 style="font-size:17px">导入别人的数据</h3>
    <p class="meta">粘贴对方导出的那段文字。</p>
    <textarea id="import-code" placeholder="粘贴"></textarea>
    <button class="btn" id="import-go">导入</button>`;
  $("mask").classList.add("show"); $("sheet").classList.add("show");
  $("import-go").onclick = () => {
    try {
      const data = unb64($("import-code").value);
      const n = store.merge(data.events || []);
      $("mask").classList.remove("show"); $("sheet").classList.remove("show");
      alert("导入了 " + n + " 条新记录");
      render(); drawMap();
    } catch (e) { alert("数据格式不对：" + e.message); }
  };
};

// ---------------- 交互 ----------------
function switchTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.id === "tab-" + name));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  if (name === "street") { render(); }
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$("mask").onclick = () => { $("mask").classList.remove("show"); $("sheet").classList.remove("show"); };
$("sheet-close").onclick = () => { $("mask").classList.remove("show"); $("sheet").classList.remove("show"); };

boot();
</script>
</body>
</html>
